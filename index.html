<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>象棋对弈</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>象棋对弈</h1>
        <div class="status">
          <p id="current-player">当前玩家：红方</p>
          <p id="check-status">状态：安全</p>
          <p id="game-status">胜负：进行中</p>
        </div>
        <div class="controls">
          <button id="restart">重新开始</button>
          <button id="undo">悔棋</button>
        </div>
        <div class="hint">
          <p>点击棋子选择，再点击高亮格子落子。人类(红方)落子后将自动触发 AI 回合。</p>
        </div>
      </section>
      <section class="board-wrapper">
        <div id="board" class="board" aria-label="象棋棋盘" role="grid"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
